# SDM 默认运行配置
# 命令行参数优先级高于本文件

model: small          # small | base | large | giant
device: null          # null=默认 CPU | cuda(GPU) | mps；要用 GPU 请显式写 cuda
backend: torch        # torch | tensorrt(需 device=cuda + 已装 TensorRT，否则自动回退 torch)
batch_size: 4
stride: 1             # >1 抽帧加速（输出帧率同比降低），预览建议 2~5
output_fps: null      # 输出 mp4 目标帧率：null=跟随源(fps_in/stride) | 24 | 30 | 60
max_frames: null      # 调试时限制帧数
smooth_alpha: null    # 给定时做时序 EMA 平滑，如 0.5
near_is_bright: true  # true=近亮远暗
colormap: null        # 如 inferno / viridis 则额外输出伪彩视频
png16_dir: null       # 如 data/outputs/clip_depth_frames 则导出 16bit 无损深度序列
models_dir: models    # 本地权重根目录
