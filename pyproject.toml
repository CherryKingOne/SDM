[project]
name = "sdm"
version = "0.1.0"
description = "Video depth estimation powered by Depth Anything V2 via HuggingFace transformers"
requires-python = ">=3.12"
dependencies = [
    "transformers>=4.45",
    "huggingface-hub>=0.24",   # ensure_model 自动下载权重依赖，不再靠传递依赖
    "torch>=2.3",
    "safetensors>=0.4",
    "numpy<2",
    "opencv-python>=4.8",
    "imageio[ffmpeg]>=2.34",
    "pillow>=10",
    "pyyaml>=6",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
# 服务器（NVIDIA GPU / Linux）专用：TensorRT 加速后端辅助依赖。
# ⚠ tensorrt 本体不入共享 lock（它的 PyPI 占位包需联网到 pypi.nvidia.com，macOS 无兼容 wheel 会构建失败），
#   故在目标服务器上单独装（见下）。
#   1) uv sync --group trt            # 装 onnx（导出 ONNX 用）
#   2) uv pip install "tensorrt>=10,<11" --extra-index-url https://pypi.nvidia.com/
trt = [
    "onnx>=1.16",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
