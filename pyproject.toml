[project]
name = "sdm"
version = "0.1.0"
description = "Video depth estimation powered by Depth Anything V2 via HuggingFace transformers"
requires-python = ">=3.12"
dependencies = [
    "transformers>=4.45",
    "huggingface-hub>=0.24",   # ensure_model 自动下载权重依赖，不再靠传递依赖
    "torch>=2.3",
    "safetensors>=0.4",
    "numpy<2",
    "opencv-python>=4.8",
    "imageio[ffmpeg]>=2.34",
    "pillow>=10",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
